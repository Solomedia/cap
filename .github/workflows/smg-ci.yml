name: SMG CI

on:
  pull_request:
    branches: [smg]
    # labeled/unlabeled re-run the migration gate when `migrations-approved` is added.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: smg-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/smg-*.yml'

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-js

      - name: Test SMG scripts
        run: bun test scripts/smg

      - name: Typecheck SMG scripts
        run: bun run tsc -p scripts/smg

  # Migrations run on server start and an image rollback does not undo them.
  migrations:
    name: migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Migration gate
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/smg/migration-gate.ts --base "origin/$BASE_REF"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-js

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.2.0

      - name: Format (Biome)
        run: biome ci . --linter-enabled=false

      - name: Typecheck
        run: |
          bun run --cwd apps/web next typegen
          bun run typecheck

      # Same list upstream's CI runs (read from its ci.yml), plus tests this PR touches.
      - name: Web unit tests
        env:
          BASE_REF: ${{ github.base_ref || 'smg' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          list=$(bun scripts/smg/web-tests.ts --base "origin/$BASE_REF" --head "$HEAD_REF")
          mapfile -t files <<< "$list"
          bun run --cwd apps/web test "${files[@]}"

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same build-time env upstream's docker-build-web.yml writes.
      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cap-web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=smg-web-amd64

  # The only required check. A skipped job counts as passing for required
  # checks, so a failed `changes` job would otherwise let untested code merge.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, scripts, migrations, web, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or were skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
