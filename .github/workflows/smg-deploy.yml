name: SMG Deploy

on:
  push:
    branches: [smg]
  workflow_dispatch:
    inputs:
      digest:
        description: "Redeploy an existing image instead of building (sha256:…). Use for rollback."
        required: false
        type: string

concurrency:
  group: smg-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/solomedia/cap-web

jobs:
  build:
    name: build
    # Only smg builds production images; a manual run from another branch does nothing.
    if: github.ref == 'refs/heads/smg' && (github.event_name == 'push' || inputs.digest == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same build-time env upstream's docker-build-web.yml writes.
      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cap-web
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:smg-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:smg
          cache-from: type=gha,scope=smg-web-amd64
          cache-to: type=gha,mode=max,scope=smg-web-amd64

  deploy:
    name: deploy
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/smg' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    # RAILWAY_TOKEN lives in this environment, limited to the smg branch.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Deploy to Railway
        env:
          DIGEST: ${{ inputs.digest || needs.build.outputs.digest }}
          SMG_DEPLOY_FREEZE: ${{ vars.SMG_DEPLOY_FREEZE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_CAP_WEB_SERVICE_ID: ${{ vars.RAILWAY_CAP_WEB_SERVICE_ID }}
          HEALTH_URL: https://cap.solomediagroup.com/api/status
        run: |
          set -o pipefail
          {
            echo "### SMG Deploy"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          bun scripts/smg/deploy-railway.ts --image "${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
