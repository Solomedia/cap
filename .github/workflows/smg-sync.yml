name: SMG Sync

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: smg-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: sync
    # Off until the "SMG Cap Bot" app exists. Meanwhile run the sync by hand
    # weekly (see SMG.md, "Weekly sync"); set SMG_BOT_ENABLED=true to turn this on.
    if: vars.SMG_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SMG_BOT_APP_ID }}
          private-key: ${{ secrets.SMG_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: smg
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/CapSoftware/Cap.git
          git config user.name "smg-cap-bot[bot]"
          git config user.email "smg-cap-bot[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Sync
        run: bun scripts/smg/sync.ts --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
